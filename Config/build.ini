; ============================================================
; build.ini
; Controls what compile.bat and build.bat include in the build.
;
; Lines starting with ';' or '#' are comments.
; Format inside each section (no spaces around '='):  Name=value
; ============================================================


; ------------------------------------------------------------
; [Build]
; CRT = MD or MT - the C runtime mode for the WHOLE project.
; Every .obj and every .lib you link must agree on this, so it's
; a single project-wide setting rather than per-library.
;
; Check which one your prebuilt libraries expect:
;   - Most official Windows binaries (GLFW, SDL2, etc.) are /MD,
;     REGARDLESS of whether you grabbed the "static lib" or
;     "dll" package from their download page. Static-vs-dynamic
;     packaging and MD-vs-MT CRT are independent choices made by
;     whoever built the library - don't assume they're linked.
;   - If you get LNK4098/LNK4217/__imp_ unresolved-symbol errors
;     mentioning libucrt/MSVCRT, try flipping this value.
; ------------------------------------------------------------
[Build]
CRT=MD


; ------------------------------------------------------------
; [Modules]
; Subfolders under \Intermediate whose .obj files get linked
; into the exe. compile.bat writes objs from \Assets into
; \Intermediate\Project by default, so "Project" is listed here.
;
;   include - link every .obj found in that folder (recursively)
;   skip    - ignore that folder entirely
;
; If this section is missing/empty, build.bat falls back to
; linking every .obj anywhere under \Intermediate.
; ------------------------------------------------------------
[Modules]
Project=include


; ------------------------------------------------------------
; [Libraries]
; Subfolders under \Library. Name must match the folder name
; exactly (e.g. "OpenGL_libx86" for \Library\OpenGL_libx86).
;
;   include - link every .lib found in that folder. Any .dll
;             found in the same folder is copied to the build
;             output automatically - no dll means nothing gets
;             copied, so it's safe to leave "include" even for
;             a fully static library with no dll at all.
;   skip    - ignore completely (not linked, nothing copied)
;
; If this section is missing/empty, both scripts fall back to
; scanning all of \Library.
; ------------------------------------------------------------
[Libraries]
OpenGL_libx86=include
OpenGL_dllx86=skip
imgui_opengl_libx86=include