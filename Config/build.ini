; ============================================================
; build.ini
; Lists every library folder under \Library and how it should
; be treated by compile.bat and build.bat.
;
; Format (one per line, no spaces around '='):
;   FolderName=status
;
; FolderName must match the subfolder name under \Library exactly
; (e.g. "OpenGL" for \Library\OpenGL).
;
; status is one of:
;   skip     - ignore this library completely (not linked, no dll copy)
;   dynamic  - link its .lib, compile with /MD, copy its .dll to the
;              build output folder (use for libraries shipped as .dll + import .lib)
;   static   - link its .lib, compile with /MT, no dll is copied
;              (use for libraries that are fully embedded in the .lib)
;
; If this file is missing, both scripts fall back to their old
; behavior: scan the whole \Library folder and link everything
; found, compiling with /MD.
; ============================================================

OpenGL_dynamic_x86=skip
OpenGL_static_x86=static
imgui_opengl_static=static
