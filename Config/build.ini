; ============================================================
; build.ini
; Controls what compile.bat and build.bat include in the build.
;
; Lines starting with ';' or '#' are comments.
; Format inside each section (no spaces around '='):  Name=value
; ============================================================


; ------------------------------------------------------------
; [Build]
; CRT = MD or MT - the C runtime mode for the WHOLE project.
; Every .obj and every .lib you link must agree on this, so it's
; a single project-wide setting rather than per-library. This is
; independent of each library's skip/dynamic/static status below -
; a fully static .lib can still expect /MD, and vice versa.
;
; If you get LNK4098/LNK4217/__imp_ unresolved-symbol errors
; mentioning libucrt/MSVCRT, try flipping this value.
; ------------------------------------------------------------
[Build]
CRT=MD


; ------------------------------------------------------------
; [Modules]
; Subfolders under \Intermediate whose .obj files get linked
; into the exe. compile.bat writes objs from \Assets into
; \Intermediate\Project by default, so "Project" is listed here.
;
;   include - link every .obj found in that folder (recursively)
;   skip    - ignore that folder entirely
;
; If this section is missing/empty, build.bat falls back to
; linking every .obj anywhere under \Intermediate.
; ------------------------------------------------------------
[Modules]
Project=include


; ------------------------------------------------------------
; [Libraries]
; Each entry is a subfolder under \Library. That folder should
; hold shared headers directly inside it, plus two subfolders:
;
;   \Library\<Name>\static\   - the full static .lib (code baked in)
;   \Library\<Name>\dynamic\  - the import .lib + the matching .dll
;
; Example:
;   \Library\OpenGL\glfw3.h
;   \Library\OpenGL\static\glfw3.lib
;   \Library\OpenGL\dynamic\glfw3dll.lib
;   \Library\OpenGL\dynamic\glfw3.dll
;
; Name must match the folder name exactly. Status selects which
; subfolder gets used:
;
;   dynamic - links the .lib found in \<Name>\dynamic and copies
;             any .dll found there to the build output folder.
;   static  - links the .lib found in \<Name>\static. Nothing is
;             ever copied for this one, even if a dll exists
;             somewhere else in that library's folder.
;   skip    - ignore the folder completely.
;
; A library folder that has NO entry here is treated as skip -
; it will not be linked or copied. Only folders you explicitly
; list get used.
;
; If this whole [Libraries] section is missing (no build.ini at
; all), both scripts fall back to scanning everything under
; \Library recursively, as a convenience default.
; ------------------------------------------------------------
[Libraries]
OpenGL=dynamic
imgui_opengl=static